# Gemma 4 26B AMT Training Configuration
# Optimized for Apple M1 Max 64GB

model: "mlx-community/gemma-4-26b-a4b-it-4bit"
data: "fabio_amt_dataset"
train: true
test: false

# Training hyperparameters
iters: 2000
batch_size: 1
max_seq_length: 1024
learning_rate: 1e-5

# LoRA configuration
fine_tune_type: lora
lora_layers: 16
lora_parameters:
  rank: 32
  alpha: 64
  dropout: 0.05
  scale: 2.0

# Memory optimization
grad_checkpoint: true
mask_prompt: true

# Logging and evaluation
steps_per_report: 10
steps_per_eval: 200
val_batches: 25
test_batches: 100

# Checkpointing
save_every: 200
adapter_path: "./gemma4_26b_amt_adapter"

# Reproducibility
seed: 42
