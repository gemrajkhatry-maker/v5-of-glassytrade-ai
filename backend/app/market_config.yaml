markets:
  NFO:
    aggression_sigma: 2.5
    displacement_multiplier: 1.5
    balance_ratio_threshold: 0.70
    underlyings:
      - NIFTY
      - BANKNIFTY
      - FINNIFTY
    default_symbol: "NIFTY 27 FEB 25500 CALL"
    scanner_underlying: "NIFTY"
    # Per-symbol big trade thresholds (FR-10-08)
    # NIFTY options: higher volume, lower threshold
    big_trade_multiplier: 3.0
    big_trade_cluster_count: 3
    big_trade_cluster_ticks: 2
    llm_instruction: >
      You are READING the auction using Fabio Valentini's AMT methodology for the NSE Index market.
      You are NOT predicting — you are interpreting market structure, order flow, and institutional behavior.
      CRITICAL FOR NSE: Pay deep attention to Open Interest (OI) walls and PCR as proxies for institutional flow.
      Consider ALL context provided: session phase, gate warnings, market state, volume bubbles, stacked imbalances,
      CVD slope, profile shape, VWAP bias, and episodic memory.
      If the story is clear and elements align, state your CONVICTION and direction.
      If you don't see a clear setup or if gate warnings are significant, STAY FLAT.
      Trust your analysis — do not override your judgment to force a trade.

  MCX:
    aggression_sigma: 2.0
    displacement_multiplier: 1.2
    balance_ratio_threshold: 0.55
    underlyings:
      - CRUDEOIL
      - GOLD
      - SILVER
      - NATURALGAS
      - COPPER
    default_symbol: "CRUDEOIL 19 MAR 6000 CALL"
    scanner_underlying: "CRUDEOIL"
    # Per-symbol big trade thresholds (FR-10-08)
    # MCX commodities: thinner books, higher threshold
    big_trade_multiplier: 5.0
    big_trade_cluster_count: 3
    big_trade_cluster_ticks: 2
    # EIA release window (FR-01-07)
    # NATURALGAS: Thursday 10:30 AM ET = 21:00 IST
    # CRUDEOIL: Wednesday 10:30 AM ET = 21:00 IST
    eia_symbols:
      - NATURALGAS
      - CRUDEOIL
    eia_suppression_minutes: 15
    llm_instruction: >
      You are READING the auction using Fabio Valentini's AMT methodology for the MCX Commodity market.
      You are NOT predicting — you are interpreting market structure, direct exchange volume, and institutional behavior.
      CRITICAL FOR MCX: Commodities have thinner order books; respect direct volume spikes and key round numbers.
      Consider ALL context provided: session phase, gate warnings, market state, volume bubbles, stacked imbalances,
      CVD slope, profile shape, VWAP bias, and episodic memory.
      If the story is clear and elements align, state your CONVICTION and direction.
      If you don't see a clear setup or if gate warnings are significant, STAY FLAT.
      Trust your analysis — do not override your judgment to force a trade.
