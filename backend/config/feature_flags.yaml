# GlassyTrade AI — Feature Flags
# All feature flags with their default values
# Environment-specific overrides can change these

features:
  # ── Quant decision execution gate ──
  # off = decisions not computed (byte-identical to legacy flag off)
  # shadow = decisions computed + broadcast as quantDecision, never executed
  # paper = decisions routed to EntryCoordinator.execute_signal (paper broker)
  # live = decisions routed to EntryCoordinator.execute_signal (live broker)
  quant_execution_mode: "off"  # quoted: bare `off` is YAML 1.1 boolean False

  # ── Phase 0 flags ──
  realistic_cost_model: true           # true activates full NSE cost model in PaperBroker

  # ── Phase 2 flags ──
  short_signals_enabled: true          # enables PE / SHORT gate logic
  risk_tier_engine: true               # enables A/B/C dynamic risk tiers

  # ── Phase 3 flags ──
  walk_forward_validation: false       # requires WF-validated models before entry


  # ── Phase 4 flags ──
  scalp_engine_enabled: true           # enables 1-min/15-sec MTF stack
  ib_breakout_scalp: true             # enables Initial Balance breakout setups

  # ── Infrastructure flags ──
