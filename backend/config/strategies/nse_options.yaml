# NSE Index Options Trading Strategy
# Activate: GLASSYTRADE_STRATEGY=nse_options
#
# PRIMARY:   NIFTY weekly options (Tuesday expiry — the only remaining weekly
#            series since Nov 2024; NIFTY weekly runs every Tuesday).
# SECONDARY: BANKNIFTY/FINNIFTY monthly options (last Tuesday expiry; their
#            weeklies were discontinued).
#
# expiry_index: 0 = nearest expiry per underlying. For NIFTY that is the
# weekly Tuesday series; for BANKNIFTY/FINNIFTY it is the monthly. The
# underlying_priority list makes NIFTY fill its scanner slots (including the
# extra slot from top_n=4) before the monthlies.

strategy:
  name: "nse_options"
  execution_model: "independent"
  description: "NSE index options trading with AMT methodology — Fabio AMT is evaluated on each traded option contract"

exchanges:
  NSE:
    enabled: true
  MCX:
    enabled: false

# Scanner Configuration
scanner:
  mode: "nse_options"
  underlyings: ["NIFTY", "BANKNIFTY", "FINNIFTY", "MIDCPNIFTY"]
  # Priority order: NIFTY weekly gets first claim, followed by BANKNIFTY, FINNIFTY, MIDCPNIFTY
  underlying_priority: ["NIFTY", "BANKNIFTY", "FINNIFTY", "MIDCPNIFTY"]
  top_n: 12
  top_per_underlying: 2
  strikes_around_atm: 3
  expiry_index: 0  # nearest expiry: NIFTY weekly (Tue), monthlies last Tue
  option_type: ""  # Auto-select based on momentum

# Exchange Configuration
exchange:
  default: "NFO"
  symbols: ["NIFTY", "BANKNIFTY", "FINNIFTY", "MIDCPNIFTY"]
  segment: "NFO"

# AMT Thresholds (optimized for NSE index options — Fabio Valentini Playbook)
amt_thresholds:
  aggression_sigma: 2.5
  displacement_multiplier: 1.5
  balance_ratio_threshold: 0.50
  cvd_block_threshold: 3000
  warm_up_minutes: 15
  obi_threshold: 0.50
  min_risk_reward: 1.5
  target_risk_reward: 2.0
  trailing_stop_activation_r: 1.0
  trailing_step_r: 0.5

# Feature Flags
feature_flags:
  risk_tier_engine: true
  short_signals_enabled: true
  llm_pre_candle_advisory: true
  scalp_engine_enabled: false
  scalp_ib_breakout: false
  realistic_cost_model: true
  allow_short: true

risk:
  risk_per_trade_pct: 0.0025
  max_daily_loss_pct: 0.02
  max_consecutive_losses: 3
  max_trades_per_session: 6
  max_concurrent_positions: 5  # 8 engines, up to 5 concurrent positions
  max_portfolio_daily_loss_pct: 0.02
  max_portfolio_risk_pct: 0.25
