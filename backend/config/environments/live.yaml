# GlassyTrade AI — Live/Production Environment
# Production-ready settings, conservative risk, WARNING logs

environment: "live"
broker_mode: "live"
log_level: "WARNING"

# Enable both exchanges (controlled by strategy)
exchanges:
  NSE:
    enabled: true
  MCX:
    enabled: true

# Conservative production risk
risk:
  risk_per_trade_pct: 0.0025  # House Money Protocol floor: 0.25% per trade
  max_daily_loss_pct: 0.01   # 1% daily max loss
  max_consecutive_losses: 2   # Halt after 2 consecutive losses
  max_concurrent_positions: 3
  max_trades_per_session: 6
  max_drawdown_pct: 0.03     # 3% max drawdown
  absolute_ceiling_pct: 0.01  # hard per-trade loss ceiling
  portfolio_notional_cap: 0.60
  per_symbol_notional_cap: 0.20

# Production cost model (full realistic)
cost_model:
  enabled: true
  base_slippage_bps: 20  # Higher slippage for live trading

# Scanner settings (conservative)
scanner:
  mode: "mcx_options"
  top_n: 2  # Fewer contracts in production
  top_per_underlying: 1
  strikes_around_atm: 1  # Only closest to ATM
  expiry_index: 0


# Production feature flags
feature_flags:
  risk_tier_engine: true
  llm_pre_candle_advisory: false
  scalp_engine_enabled: false  # Disable scalping in production initially
  realistic_cost_model: true
