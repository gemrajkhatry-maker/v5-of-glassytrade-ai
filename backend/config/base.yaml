# GlassyTrade AI — Base Configuration
# All symbols, all exchanges, all defaults
# Loaded first, then overridden by environment and strategy files

system:
  name: GlassyTrade AI
  version: "2.0.0"
  candle_timeframe_minutes: 5
  tick_history_depth: 500
  db_path: "glassytrade.db"
  log_level: "INFO"
  capital: 5000000.0

# ── Operator Environment Variables ──
# These env vars override config values at runtime (no code changes needed):
#   GLASSYTRADE_USE_RANGE_BARS=1   Enable ATR-dynamic range bars (spec §4).
#                                   Off by default (fixed-interval candles).
#                                   Accepts: 1/true/yes/on | 0/false/no/off
#   GLASSYTRADE_HOTPATH_TRACE=1    Enable opt-in hot-path phase tracing.
#   GLASSYTRADE_SEED_INTERVAL_SEC  History seed fetch rate-limit interval.

# ── Global Constants (migrated from constants.py) ──
globals:
  # Volume Profile
  # Fabio AMT spec §5.1 rule 4: LVN = { p | V(p) < 0.35 x V_bar_profile AND
  # d^2V(p)/dp^2 > 0 }. The absolute floor gates LVN detection alongside the
  # percentile rank (the stricter binds) — see constants.LVN_VOL_FRACTION.
  lvn_vol_fraction: 0.35
  lvn_percentile: 20.0  # percentile gate (complements the absolute floor)
  lvn_threshold: 0.15  # dead alias (unused); kept for API compatibility
  hvn_threshold: 2.00  # dead alias (unused); kept for API compatibility
  value_area_pct: 0.682  # Fabio AMT spec §5.1 rule 3: VA = 68.2% of total volume
  lvn_smoothing: 3
  lvn_min_persistence_bars: 3
  lvn_removal_threshold: 0.30
  delta_bucket_size_default: 0.05
  delta_profile_buckets: 200

  # Order Flow / CVD
  cvd_slope_window: 20
  cvd_strong_slope: 2.0
  cvd_slope_hard_block: 50.0
  cvd_slope_warning: 30.0
  cvd_slope_extreme: 100.0
  cvd_slope_persistence_bars: 3
  cvd_slope_extended_window: 40
  cvd_block_threshold_nse: 5000
  cvd_block_threshold_mcx: 50
  footprint_imbalance_ratio: 3.0
  footprint_imbalance_pct: 0.40
  absorption_range_ratio_max: 0.50
  absorption_vol_mult: 1.50
  big_trade_multiplier: 5.0
  big_trade_cluster_count: 3
  big_trade_cluster_ticks: 2
  volume_bubble_sigma: 2.0
  ofi_window: 10
  delta_zone_sigma_mult: 2.5

  # Market State
  poc_no_trade_ticks: 20
  balance_ratio_threshold: 0.55
  drive_rejection_wick_ratio: 0.5
  displacement_multiplier: 1.5

  # Aggression Scoring
  aggression_footprint: 1.0
  aggression_cvd: 1.0
  aggression_big_trade: 1.0
  aggression_absorption: 0.5
  aggression_ofi: 0.5
  aggression_confluence: 0.5
  aggression_bubble: 0.5
  min_aggression_score: 2.0
  pyramid_aggression_score: 3.0
  aggression_persistence_bars: 3
  aggressive_print_sigma: 2.5

  # Structure
  structure_dwell_ticks: 3
  structure_cooldown_ticks: 3
  structure_confidence_gate: 60
  structure_bypass_confidence: 70

  # Trade Setup
  min_rr_ratio: 1.5
  max_cushion_ticks: 10
  signal_ttl_seconds: 600
  vwap_extreme_multiplier: 1.01
  decision_history_limit: 1000
  cooldown_minutes: 15

  # Risk
  risk_per_trade_pct: 0.005
  max_daily_loss_pct: 0.020
  max_consecutive_losses: 3
  max_drawdown_pct: 0.030
  absolute_ceiling_pct: 0.010

  # Volume Thresholds
  volume_impulse_multiplier: 1.5
  volume_aggression_multiplier: 2.5

  # Time
  warm_up_minutes_mcx: 15
  warm_up_minutes_nse: 15
  ib_candles: 2

  # LLM Throttling
  llm_cooldown_seconds: 10
  staleness_timeout_seconds: 30

  # Grade
  grade_extreme_threshold: -5

  # Data Limits
  max_candles: 1000
  tick_batch_size: 50
  tick_flush_interval_secs: 5.0

