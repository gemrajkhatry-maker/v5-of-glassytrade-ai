# Quick Test Configuration - 100 iterations
model: "mlx-community/gemma-4-26b-a4b-it-4bit"
data: "fabio_amt_dataset"
train: true
test: false

# Quick test
iters: 100
batch_size: 1
max_seq_length: 512
learning_rate: 1e-5

# LoRA configuration - conservative
fine_tune_type: lora
num_layers: 8
lora_parameters:
  rank: 16
  alpha: 32
  dropout: 0.05
  scale: 2.0

# Memory optimization
grad_checkpoint: true
mask_prompt: true

# Logging
steps_per_report: 10
steps_per_eval: 50
val_batches: 10

# Checkpointing
save_every: 50
adapter_path: "./gemma4_26b_amt_adapter_test"

# Reproducibility
seed: 42
