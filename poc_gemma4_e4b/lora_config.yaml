# Gemma-4-E4B-it LoRA Fine-Tuning Config (Marathon Checklist Run)
# mlx_lm lora config format

model: "mlx-community/gemma-4-e4b-it-nvfp4"
train: true
data: "poc_gemma4_e4b/data"
adapter_path: "poc_gemma4_e4b/adapters"

# Training — Stability for 800 iters
iters: 800                      # Marathon target
batch_size: 1
grad_accumulation_steps: 32      # Stable for Metal
learning_rate: 2e-5             # Slightly higher to enforce the new format
optimizer: "adamw"
mask_prompt: true 
max_seq_length: 1024            # Full context for reasoning

# LoRA config (Deepened for logic + format)
fine_tune_type: "lora"
rank: 32                        # High capacity
num_layers: 12                  # Deep reasoning
resume_adapter_file: "poc_gemma4_e4b/adapters/0000200_adapters.safetensors"

# Eval + checkpointing
val_batches: 8
steps_per_eval: 25
steps_per_report: 10
save_every: 100                 # Save at 100, 200... 800

# Reproducibility
seed: 42
