model: "mlx-community/gemma-4-26b-a4b-it-4bit"
data: "fabio_amt_dataset"
data_train: "train_json.jsonl"
data_val: "valid_json.jsonl"
train: true
test: false

# Training hyperparameters
iters: 2000
batch_size: 1
max_seq_length: 768
learning_rate: 1e-5

# LoRA configuration
fine_tune_type: lora
lora_layers: 16
lora_parameters:
  rank: 32
  alpha: 64
  dropout: 0.05
  scale: 2.0

# Memory optimization
grad_checkpoint: true
mask_prompt: true

# Checkpointing
save_every: 50
adapter_path: "./gemma4_26b_amt_adapter_json"
resume_adapter_file: "./gemma4_26b_amt_adapter_json/0000200_adapters.safetensors"

# Seed for reproducibility
seed: 42

# Additional memory optimizations
cache_size: 0
