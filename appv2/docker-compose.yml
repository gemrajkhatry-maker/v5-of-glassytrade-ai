# AMT Live Trading System v2
services:
  backend:
    build:
      context: ..
      dockerfile: appv2/backend/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v2/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../
      dockerfile: appv2/frontend/Dockerfile
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
