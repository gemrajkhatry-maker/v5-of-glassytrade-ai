# BackendV2 production environment template.
# This file is intentionally minimal and explicit: wire real values before go-live.

environment: "production"
broker_mode: "live"
log_level: "WARNING"

exchanges:
  NSE:
    enabled: true
  MCX:
    enabled: true

risk:
  # TODO: set production risk budget
  risk_per_trade_pct: 0.001
  max_daily_loss_pct: 0.01
  max_consecutive_losses: 2
  max_concurrent_positions: 3
  max_drawdown_pct: 0.03

cost_model:
  # TODO: tune to broker/floor cost profile
  enabled: true
  base_slippage_bps: 15

scanner:
  # TODO: set scanning cadence and breadth
  mode: "mcx_options"
  top_n: 3
  top_per_underlying: 1
  strikes_around_atm: 1
  expiry_index: 0
