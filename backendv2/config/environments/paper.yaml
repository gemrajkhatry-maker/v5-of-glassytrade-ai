environment: "paper"
broker_mode: "paper"
log_level: "INFO"

exchanges:
  NSE:
    enabled: true
  MCX:
    enabled: true

risk:
  risk_per_trade_pct: 0.005
  max_daily_loss_pct: 0.02
  max_consecutive_losses: 3
  max_concurrent_positions: 5

cost_model:
  enabled: true
  base_slippage_bps: 15

scanner:
  mode: "mcx_options"
  top_n: 4
  top_per_underlying: 2
  strikes_around_atm: 2
  expiry_index: 0

