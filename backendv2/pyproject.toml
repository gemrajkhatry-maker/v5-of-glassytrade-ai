[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glassytrade-backend"
version = "2.0.0"
description = "AI-powered algorithmic trading platform backend"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "GlassyTrade Team"},
]
keywords = ["trading", "algorithmic-trading", "ai", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # Web framework
    "fastapi>=0.110",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=1.0",
    "websockets>=15.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "httptools>=0.6",
    "watchfiles>=0.20",
    # Data & validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "numpy>=2.0",
    "pandas>=2.0",
    # Async
    "anyio>=4.0",
    # Broker
    "dhanhq>=2.2",
    # AI / ML (optional in production, required for dev)
    "huggingface-hub>=0.20",
    "transformers>=4.40",
    "torch>=2.0",
    "torchvision>=0.15",
    "accelerate>=0.30",
    "bitsandbytes>=0.40",
    # Apple Silicon inference (optional)
    "mlx>=0.15; sys_platform == 'darwin'",
    "mlx-lm>=0.15; sys_platform == 'darwin'",
    "mlx-metal>=0.15; sys_platform == 'darwin'",
    "mlx-vlm>=0.4; sys_platform == 'darwin'",
    # RL
    "gymnasium>=0.29",
    # Utilities
    "python-dotenv>=1.0",
    "Jinja2>=3.1",
    "dill>=0.3",
    "diskcache>=5.6",
    "html2text>=2024.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "coverage>=7.0",
    "hypothesis>=6.100",
    "grimp>=3.0",
]
lint = [
    "ruff>=0.4",
    "mypy>=1.9",
    "bandit>=1.7",
]
test = [
    "glassytrade-backend[dev]",
]
all = [
    "glassytrade-backend[dev,lint]",
]

[project.scripts]
glassytrade = "app.api.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff ──────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── MyPy ──────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

# ── Pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

# ── Coverage ──────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*",
    "app/api/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ── Bandit ────────────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert_used is fine in tests
