[pytest]
# Live broker tests (TestLiveIntegration) require real Dhan credentials and
# are documented as skip-by-default. Register the mark and deselect it so a
# normal run never touches the live API. Run them explicitly with:
#     pytest brokers/broker/dhan/tests -m integration
markers =
    integration: live broker API tests requiring real credentials (skip by default)
    live: live broker API tests (skip by default)
addopts = -m "not integration and not live"
