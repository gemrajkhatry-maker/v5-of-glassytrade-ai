# Gemma-4-26B-A4B LoRA Training Configuration
# CRASH-PROOF: Adjusted to avoid Metal "Impacting Interactivity" errors
# Optimized for Apple M1 Max 64GB

# Model settings
model: mlx-community/gemma-4-26b-a4b-it-4bit
train: true
data: fabio_amt_dataset
adapter_path: ./gemma4_26b_amt_adapter_final
fine_tune_type: lora

# LoRA parameters
num_layers: 16
lora_parameters:
  rank: 32
  dropout: 0.05
  scale: 2.0

# Training settings - REDUCED seq length to avoid Metal crash
batch_size: 1
iters: 1000
learning_rate: 1e-5
grad_checkpoint: true
max_seq_length: 512

# Validation - set very high to minimize validation runs
steps_per_eval: 10000
val_batches: 1

# Checkpointing every 100 iterations
save_every: 100

# Optimizer and seed
optimizer: adamw
seed: 42
