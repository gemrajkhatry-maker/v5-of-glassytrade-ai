# Gemma 4 26B Hybrid Stability: GPU Optimized
# Balanced for 64GB Unified Memory and macOS Interactivity

model: "mlx-community/gemma-4-26b-a4b-it-4bit"
data: "fabio_amt_dataset"
train: true
test: false

# Hyperparameters
iters: 2000
batch_size: 1
learning_rate: 1e-5
max_seq_length: 768    # Reduced from 1024 to save VRAM

# LoRA Parameters (Optimized Rank 16)
fine_tune_type: lora
lora_layers: 16
lora_parameters:
  rank: 16             # Reduced from 32 to stay within interactivity limits
  alpha: 32            # 2x Rank
  dropout: 0.05
  scale: 2.0

# Memory Optimizations
grad_checkpoint: true
mask_prompt: true
cache_size: 0

# Validation (Efficient)
val_batches: 5
steps_per_eval: 200

# Checkpointing
save_every: 50
adapter_path: "./gemma4_26b_clean_adapter"

# Seed
seed: 42
