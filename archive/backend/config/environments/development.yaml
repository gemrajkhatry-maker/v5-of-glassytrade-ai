# GlassyTrade AI — Development Environment
# Single symbol (NIFTY), paper broker, DEBUG logs, relaxed risk

environment: "development"
broker_mode: "paper"
log_level: "DEBUG"

# Disable all symbols except NIFTY in development
exchanges:
  NSE:
    enabled: true
    symbols:
      NIFTY:
        enabled: true
      BANKNIFTY:
        enabled: false
      FINNIFTY:
        enabled: false
  MCX:
    enabled: false

# Relaxed risk for development
risk:
  risk_per_trade_pct: 0.005
  max_daily_loss_pct: 0.10  # generous for testing
  max_consecutive_losses: 10  # generous for testing
  max_concurrent_positions: 3

# Paper broker costs
cost_model:
  enabled: true
  base_slippage_bps: 15

# Scanner settings for development
scanner:
  mode: "nse_options"
  top_n: 1
  top_per_underlying: 1
  strikes_around_atm: 2
  expiry_index: 0

# LLM settings for development (faster timeout)
llm:
  timeout_seconds: 30
  temperature_entry: 0.5  # More creative for testing
