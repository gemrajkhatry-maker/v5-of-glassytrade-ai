name: replay
description: File replay for backtesting — identical pipeline, different ingestor

channels:
  raw_ticks:
    capacity: 5000   # larger — replay can burst
  candles:
    capacity: 1000
  amt_results:
    capacity: 500
  signal_gates:
    capacity: 200
  llm_decisions:
    capacity: 100

processors:
  - name: file_replay_ingestor
    class: app.pipeline.processors.ingest.FileReplayIngestor
    outbox:
      raw_ticks: raw_ticks
    settings:
      file_path: data/replay/ticks.jsonl
      speed_multiplier: 100.0   # 100x faster than real time
      loop: false

  - name: candle_builder
    class: app.pipeline.processors.candle.CandleBuilderProcessor
    inbox:
      raw_ticks: raw_ticks
    outbox:
      candles: candles
    settings:
      interval: 5m

  - name: amt_analyzer
    class: app.pipeline.processors.analysis.AMTAnalysisProcessor
    inbox:
      candles: candles
    outbox:
      amt_results: amt_results
    settings:
      lookback: 50

  - name: signal_gate
    class: app.pipeline.processors.gate.SignalGateProcessor
    inbox:
      amt_results: amt_results
    outbox:
      signal_gates: signal_gates
    settings: {}

  - name: llm_entry
    class: app.pipeline.processors.llm_entry.LLMEntryProcessor
    inbox:
      signal_gates: signal_gates
    outbox:
      llm_decisions: llm_decisions
    settings:
      timeout_seconds: 15
