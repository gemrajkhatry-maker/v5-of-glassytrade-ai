name: Tests

on:
  push:
    branches: [main, dev, stable_3]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e domain/ -e brokers/ -e "trading/[full]"
          # pandas/pyarrow back the datalake (ParquetStorage); declared outside
          # pyproject extras so they are installed explicitly here.
          pip install pandas pyarrow pytest pytest-cov pytest-timeout ruff mypy

      - name: Compile packages
        run: python -m compileall -q domain/src brokers/src trading/src

      - name: Lint (ruff)
        run: ruff check domain/src brokers/src trading/src

      - name: Type check (mypy)
        run: |
          cd domain && mypy src
          cd ../brokers && mypy src
          cd ../trading && mypy src

      - name: Domain tests
        run: cd domain && pytest -q

      - name: Brokers tests
        run: cd brokers && pytest -q

      - name: Trading tests (unit + integration + parity)
        run: |
          cd trading && pytest -q \
            --cov=tradex_trading --cov=tradex_domain --cov=tradex_brokers \
            --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: trading/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build (tsc strict + vite)
        run: cd frontend && npm run build
