name: Tests

on:
  push:
    branches: [main, stable_3]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-timeout
          pip install -e backendv2/ 2>/dev/null || true
          pip install ruff

      - name: Lint with ruff
        run: |
          cd backendv2 && ruff check app/ tests/

      - name: Run unit tests with coverage
        run: |
          cd backendv2 && PYTHONPATH=. python -m pytest tests/unit/ -v --cov=app --cov-report=xml --tb=line

      - name: Run integration tests
        run: |
          cd backendv2 && PYTHONPATH=. python -m pytest tests/integration/ -v --tb=line --timeout=300

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backendv2/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
