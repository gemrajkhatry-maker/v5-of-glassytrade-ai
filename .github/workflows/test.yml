name: Tests

on:
  push:
    branches: [main, stable_3, stable_6, stable_7]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-timeout
          # mlx* is Apple-Silicon-only; quant/amt/compute.py already guards the import.
          grep -v -E '^(mlx|mlx-lm|mlx-vlm)' backend/requirements.txt > /tmp/backend-requirements-ci.txt
          pip install -r /tmp/backend-requirements-ci.txt
          pip install -r brokers/requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: |
          ruff check quant/ backend/app/ brokers/broker/ --exit-zero

      - name: Quant + system tests
        run: |
          # Collecting tests/ and backend/tests together shadows the `tests`
          # package (backend/ is on pythonpath). Run the trees separately.
          PYTHONPATH=. python -m pytest tests/ --ignore=tests/e2e -q --tb=short --cov=quant --cov-report=xml

      - name: Backend unit/integration tests
        run: |
          PYTHONPATH=backend:. python -m pytest backend/tests/ -q --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
