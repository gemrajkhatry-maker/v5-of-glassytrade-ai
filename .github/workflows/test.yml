name: Tests

on:
  push:
    branches: [main, stable_3, stable_6, stable_7]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pytest-asyncio pytest-timeout pytest-mock hypothesis jsonschema ruff
          grep -v -E '^(mlx|mlx-lm|mlx-vlm)' backend/requirements.txt > /tmp/backend-requirements-ci.txt
          python -m pip install -r /tmp/backend-requirements-ci.txt
          python -m pip install -r brokers/requirements.txt

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Lint with Ruff
        run: python -m ruff check quant backend/app backend/src brokers shared tests backend/tests

      - name: Backend tests
        run: cd backend && PYTHONPATH=..:src:. python -m pytest tests/ -q --maxfail=1

      - name: Quant and system tests
        run: PYTHONPATH=backend:backend/src:. python -m pytest tests/ -q --maxfail=1 --ignore=tests/e2e

      - name: Broker tests
        run: cd brokers && PYTHONPATH=..:. python -m pytest -q

      - name: Frontend tests
        run: cd frontend && npm test

      - name: Frontend typecheck
        run: cd frontend && npx tsc --noEmit
