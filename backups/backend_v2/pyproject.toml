[project]
name = "glassytrade-ai-v2"
version = "2.0.0"
description = "GlassyTrade AI - AMT Order Flow Strategy Engine V2"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    "uvloop==0.21.0",
    "websockets==13.1",
    "aiohttp==3.11.0",
    "numpy==2.2.0",
    "pandas==2.2.0",
    "orjson==3.10.0",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.0",
    "duckdb==1.2.0",
    "python-dotenv==1.0.0",
    "structlog==25.1.0",
    "prometheus-client==0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.25.0",
    "pytest-cov==5.0.0",
    "ruff==0.8.0",
    "mypy==1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true